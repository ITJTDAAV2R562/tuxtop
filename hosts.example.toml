# Copy to hosts.toml and edit. hosts.toml is gitignored — it names your
# internal machines.
#
# `addr` is anything OpenSSH accepts: an alias from ~/.ssh/config, a hostname,
# or an IP. Aliases are preferred, since ProxyJump and IdentityFile then come
# along for free.
#
# Authentication is delegated to the Windows OpenSSH agent or Pageant.
# Tuxtop never reads a private key and never prompts for a passphrase.

[[host]]
name = "example-a"
addr = "example-a.internal"
user = "you"
# Optional. Beszel hub for this host's 1-minute history. Omit for live-only:
# the core grid works either way, there is just nothing behind it.
beszel_url = "https://example-a.internal"

[[host]]
name = "example-b"
addr = "example-b"     # resolved through ~/.ssh/config
user = "root"
port = 22
