# Copy to hosts.toml and edit. hosts.toml is gitignored — it names your
# internal machines.
#
# `addr` is anything OpenSSH accepts: an alias from ~/.ssh/config, a hostname,
# or an IP. Aliases are preferred, since ProxyJump and IdentityFile then come
# along for free.
#
# Authentication is delegated to the Windows OpenSSH agent or Pageant.
# Tuxtop never reads a private key and never prompts for a passphrase.

[[host]]
name = "example-a"
addr = "example-a.internal"
user = "you"
# Optional. Beszel hub for this host's 1-minute history. Omit for live-only:
# the core grid works either way, there is just nothing behind it.
beszel_url = "https://example-a.internal"

[[host]]
name = "example-b"
addr = "example-b"     # resolved through ~/.ssh/config
user = "root"
port = 22

# A Windows host. Needs OpenSSH Server enabled — a first-party optional
# Windows feature, not an agent — and key auth set up, the same as any Linux
# host. `os` is explicit rather than probed: guessing wrong produces a host
# that fails in a way the fault text cannot explain.
#
# [[host]]
# name = "n1"
# addr = "n1"
# port = 2222        # if WSL already holds 22 on the same machine
# os = "windows"

# A host taken out of the rotation for planned maintenance. Tuxtop makes no
# connection to it and reports nothing about it, but keeps its history,
# group, interval and position in the grid — which is what removing it and
# adding it back afterwards would throw away.
#
# Also settable from the app: the pause button on the card, or the per-host
# table in Settings. Nothing resumes it automatically; that is deliberate,
# since detecting the host is back would mean connecting to it.
#
# [[host]]
# name = "wader"
# addr = "wader"
# paused = true

# Watch another Tuxtop's fleet instead of sampling here: one sampler, many
# viewers, so nineteen machines are not connected to twice (ADR-017). Absent
# means this window samples its own hosts above, which is the default and the
# only mode until you name a server.
#
# Plain HTTP only — `https://` is refused with the fix named, because the
# viewer delegates encryption to the transport under it: reach the server over
# `ssh -L` to loopback, or over a tailnet or VPN address it was `--bind`ed to
# (ADR-018). The host list above stays local and untouched; it is what you
# switch back *to*.
#
# Also settable from Settings in the window, which is the only door: clearing
# the field there returns to the local fleet. History is per window and is
# discarded on a switch, never blended between two fleets.
#
# [settings]
# server = "dove:8787"
#
# Servers worth keeping, so several fleets - or several customers - are one
# selection rather than one edit. Name them what you call them.
#
# These are *this viewer's* notes about where it can point, not part of any
# fleet, so they stay editable while you are watching a server - saving the one
# you are on is the commonest reason to reach for the list. Forgetting an entry
# only forgets the address; it does not leave the fleet it names.
#
# [[endpoints]]
# name = "a customer"
# url = "http://dove:8787"
#
# [[endpoints]]
# name = "lab"
# url = "coot:9000"

# Global settings. Everything here is also editable from Settings in the
# window; this file is what a fresh install starts from.
#
# [settings]
# interval_ms = 1000       # 250 and 500 are offered too
# history_cap_mb = 256
# always_on_top = false
#
# Ask GitHub once per launch whether a newer Tuxtop exists. Default true.
#
# This is the only thing Tuxtop asks of anywhere other than the hosts above.
# Set it false on an isolated network and the app makes no request of its own,
# ever. It governs the *check* only: a newer release raises a notice you can
# dismiss, and nothing downloads until you press the button (ADR-015).
# update_check = true
