# Tag-driven release. `git tag v0.2.0 && git push --tags` produces a Windows
# installer and a Linux tuxtop-serve tarball, attached to a GitHub Release.
#
# Two shells, two artefacts (see CLAUDE.md "Two shells, one service"): the
# desktop app for the Windows box, the headless server for a Linux host reached
# through a browser. Both are built from the same commit the tag points at, so
# they cannot drift apart between releases.
#
# Nothing is code-signed. Windows SmartScreen will warn on first run of the
# installer, and that is expected rather than a build failure — signing needs a
# certificate this project does not have. The release notes say so, because an
# unexplained warning is how a user learns to click through warnings.
#
# Everything runs on GitHub-hosted runners, for the reason at the top of
# ci.yml: a self-hosted runner on a public repo executes pull-request code on
# the runner host. Actions are pinned to a commit SHA — doubly worth it here,
# where the job holds a token that can publish a release under this account.
name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build both artefacts and publish nothing — `publish` is gated
  # on the ref being a tag. That is the dry run; there is no flag for it,
  # because a flag that only ever holds one value is a control with no effect.
  workflow_dispatch:

# Every job that needs more than read says so itself. `publish` is the only one
# that does.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail before spending twenty minutes of build on a tag that disagrees with
  # the source. A release whose binaries report a different version than the
  # tag is worse than no release: the tag is what anyone quotes in a bug report.
  guard:
    name: guard — the tag matches the source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every ${{ }} value reaches the script through env: rather than being
      # pasted into it. GitHub expands a template before the shell parses the
      # line, so an interpolated tag name is code, not an argument — and a tag
      # is the one input here that a push can choose.
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/check-version.py "$REF_NAME"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/check-version.py
            echo "version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")" >> "$GITHUB_OUTPUT"
          fi

  # The full CI gate, on the tagged commit. A tag can point at a commit that
  # never went through CI — pushed together, or moved after the fact — so the
  # checks run again here rather than being assumed.
  gate:
    name: gate — CI on the tagged commit
    needs: guard
    uses: ./.github/workflows/ci.yml

  windows:
    name: windows — installer
    needs: [guard, gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup and node are preinstalled on windows-latest.
      #
      # Deliberately no build cache anywhere in this workflow, unlike ci.yml. A
      # GitHub Actions cache is writable from a pull-request run and would be
      # readable here, which is a path from "anyone can open a PR" to "bytes of
      # unknown origin inside a published installer". A release happens on a
      # tag a few times a year; a cold build is cheap, and this is the one
      # workflow where provenance is worth more than speed.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # Explicitly off, for the reason above: the npm cache is writable
          # from a pull-request run and this job builds a published installer.
          package-manager-cache: false

      # @tauri-apps/cli ships a prebuilt binary, so this is a download rather
      # than the four-minute `cargo install tauri-cli` it replaces. The version
      # is pinned by package-lock.json like every other tool here.
      - run: npm ci

      # Run from the repo root: the CLI finds src-tauri/tauri.conf.json by its
      # own convention, and that config points frontendDist at ../src.
      # The signing key is what makes the updater safe to have at all: it
      # downloads an installer and runs it, so an unverified one would be
      # remote code execution by design. Without these variables the bundler
      # still produces installers but no .sig files, and every client rejects
      # the update - which is the correct failure, but a silent one at release
      # time, so the step below checks the signatures actually appeared.
      #
      # This is *not* Authenticode. Code signing stays declined (CLAUDE.md,
      # "Releasing"); SmartScreen will still warn on first run.
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      # Named by hand rather than globbed into the release, so a bundle that
      # silently failed to produce one of the two targets fails here instead of
      # publishing a release that is quietly missing an installer.
      # PowerShell rather than `shell: bash`, which is the default here anyway
      # and keeps the step working if this ever runs on a Windows box where
      # `bash` resolves to WSL rather than Git Bash — that swap cost a release
      # once, with "No such file or directory" for a script plainly present.
      - name: Collect
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi |
                 Select-Object -First 1
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe |
                 Select-Object -First 1
          # Named by hand rather than globbed into the release, so a bundle
          # that silently failed to appear fails here instead of publishing a
          # release quietly missing an installer.
          if (-not $msi) { throw 'no .msi was produced' }
          if (-not $exe) { throw 'no NSIS -setup.exe was produced' }
          Copy-Item $msi "dist/tuxtop-$env:VERSION-x64.msi"
          Copy-Item $exe "dist/tuxtop-$env:VERSION-x64-setup.exe"

          # The updater installs the NSIS build, so its signature is the one
          # that has to exist. A missing .sig is not a broken build - it is a
          # release every installed copy will silently refuse to update to,
          # which is far more expensive to discover later than here.
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) {
            throw "no .sig beside $($exe.Name) - was TAURI_SIGNING_PRIVATE_KEY set?"
          }
          Copy-Item $sig "dist/tuxtop-$env:VERSION-x64-setup.exe.sig"
          Get-ChildItem dist | ForEach-Object {
            '{0}  {1:N1} MB' -f $_.Name, ($_.Length / 1MB)
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/

  linux:
    name: linux — tuxtop-serve
    needs: [guard, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # No build cache here either — see the windows job above.
      - run: cargo build --release --locked -p tuxtop-serve

      # The binary alone is not runnable: --web defaults to ./src, so the
      # frontend ships beside it and the default resolves from the extracted
      # directory. Shipping the binary on its own produces a server that starts
      # and then 404s every page.
      - name: Package
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          v=$VERSION
          d=tuxtop-serve-$v-linux-x86_64
          mkdir -p "$d"
          cp target/release/tuxtop-serve "$d"/
          cp -r src "$d"/src
          cp hosts.example.toml "$d"/
          cat > "$d"/README.txt <<TXT
          tuxtop-serve $v

              ./tuxtop-serve --hosts hosts.toml --port 8787

          Binds loopback only and has no authentication. Put \`tailscale serve\`
          or an SSH tunnel in front of it; do not bind it to a public interface.

          Read-only unless started with --writable, because adding a host makes
          this machine open an SSH connection with its own keys.

          Run it from this directory, or pass --web /path/to/src.
          TXT
          tar czf "$d.tar.gz" "$d"
          sha256sum "$d.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: tuxtop-serve-*.tar.gz

  publish:
    name: publish
    needs: [guard, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The manifest the updater actually reads. Without it the endpoint in
      # tauri.conf.json 404s and every installed copy quietly concludes it is
      # up to date - the feature would look fine and do nothing, which is this
      # project's least favourite kind of bug.
      #
      # `releases/latest/download/latest.json` always resolves to the newest
      # non-prerelease, so the URL never changes and nothing has to rewrite it.
      # The `signature` field is the *contents* of the .sig file, not a path.
      #
      # Built with jq rather than string interpolation: every value arrives as
      # a bound argument, so a version or signature cannot break out of the
      # JSON it is being written into.
      - name: Update manifest
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sig=$(cat "dist/tuxtop-$VERSION-x64-setup.exe.sig")
          url="https://github.com/$REPO/releases/download/v$VERSION/tuxtop-$VERSION-x64-setup.exe"
          jq -n --arg v "$VERSION" --arg sig "$sig" --arg url "$url" \
                --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            version: $v,
            notes: ("Tuxtop " + $v),
            pub_date: $date,
            platforms: { "windows-x86_64": { signature: $sig, url: $url } }
          }' > dist/latest.json
          cat dist/latest.json

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Release notes
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          v=$VERSION
          cat > notes.md <<TXT
          ## Install

          **Windows desktop app** — download the \`-setup.exe\` (or the \`.msi\`).

          The installer is **unsigned**, so SmartScreen will show
          "Windows protected your PC" on first run. More info → Run anyway.
          Signing needs a certificate this project does not have.

          **Linux headless server** — \`tuxtop-serve-$v-linux-x86_64.tar.gz\`:

          \`\`\`sh
          tar xzf tuxtop-serve-$v-linux-x86_64.tar.gz
          cd tuxtop-serve-$v-linux-x86_64
          ./tuxtop-serve --hosts hosts.toml --port 8787
          \`\`\`

          Loopback only, no authentication, read-only unless \`--writable\`.
          Front it with \`tailscale serve\`.

          Neither needs anything installed on a monitored host — SSH and a
          POSIX shell is the whole requirement.

          Verify downloads against \`SHA256SUMS\`.
          TXT

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" \
            --title "Tuxtop $REF_NAME" \
            --notes-file notes.md \
            dist/*
