# Every push and pull request. The point is to catch what has actually broken
# here: a commit that does not compile reaching `main`, and a frontend change
# that breaks a layout nobody re-checks by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml, so a tag re-runs the full gate on the exact
  # commit it points at rather than trusting that the commit passed once.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core — tests, lints, checkers
    # dove: 32 cores, self-hosted. Self-hosted minutes are not billed, which is
    # why CI runs at all — GitHub-hosted jobs on this account are blocked on a
    # payment state. See docs/CI.md for the runner and its safety condition.
    runs-on: [self-hosted, linux, dove]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # No Swatinem/rust-cache here: the workspace and ~/.cargo persist between
      # runs on a self-hosted runner, so target/ is already warm. Restoring a
      # cache over it would be slower, not faster.

      # tuxtop-core builds and tests anywhere, which is the whole reason it is
      # a separate crate outside the Tauri workspace (ADR-006).
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS unit tests
        run: node --test 'tests/*.test.js'

      # These three encode rules that are otherwise silent when broken: a theme
      # token missing from one of three states, a metric with no aggregation
      # rule, a command no frontend code calls.
      - run: python3 scripts/check-theme-tokens.py
      - run: python3 scripts/check-agg-declared.py
      - run: python3 scripts/check-commands-reachable.py
      # Four files carry the version. Catching drift on push is cheaper
      # than discovering it when a tag fails the release guard.
      - run: python3 scripts/check-version.py

  browser:
    name: browser — layout and load order
    runs-on: [self-hosted, linux, dove]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  windows:
    name: windows — the Tauri shell compiles
    # n1, self-hosted: the only Windows machine here, and the one that already
    # builds the installer by hand. dove cannot do this job — it is Linux.
    runs-on: [self-hosted, windows, n1]
    steps:
      - uses: actions/checkout@v4
      # No toolchain or cache actions: rustup is already installed on n1 and
      # src-tauri/target persists between runs, so the build starts warm. A
      # cache restored over a warm target/ is slower, not faster.
      # src-tauri is deliberately not a workspace member - it pulls webkit2gtk
      # on Linux, which the development box does not have - so it is only ever
      # compiled here. A commit that does not build has reached main more than
      # once because this step did not exist.
      - name: Build the desktop app
        working-directory: src-tauri
        run: cargo build --locked
