# Dependency updates, opened as pull requests.
#
# `github-actions` is the one that earns its keep: every third-party action in
# .github/workflows is pinned to a commit SHA rather than a tag, which is the
# right thing for supply-chain reasons and means nothing gets security fixes on
# its own. Dependabot moves the pin and rewrites the `# vX.Y.Z` comment beside
# it, which is the only maintainable way to keep SHA pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  # Two Cargo trees, updated together in one pull request rather than two.
  #
  # src-tauri is outside the workspace (ADR-006) and carries its own lockfile,
  # which a workspace resolve never touches. As two separate entries this
  # produced two PRs, and the workspace one bumped a dependency of
  # `tuxtop-core` while leaving `src-tauri/Cargo.lock` still recording the old
  # version — so the windows job, which builds `--locked`, refused it. That is
  # not an occasional flake: *every* update to a dependency the two trees share
  # failed that way, which is how a permanently red check teaches people to
  # ignore a red check.
  #
  # `directories` (plural) puts both in one update, so the two locks move in
  # the same commit. If a PR still arrives with them out of step,
  # scripts/check-locks.py says so in a second and names the one command that
  # fixes it — the belt to this braces.
  - package-ecosystem: cargo
    directories:
      - /
      - /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      cargo:
        patterns: ["*"]

  # Test and release tooling only; nothing here ships inside the product.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      npm:
        patterns: ["*"]
