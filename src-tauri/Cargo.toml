# Its own workspace root. Cargo refuses to build a package that sits inside a
# workspace directory without being a member, and ADR-006 keeps this out of the
# root workspace so `cargo test` there never tries to build the GUI.
[workspace]

[package]
name = "tuxtop"
version = "0.5.1"
edition = "2021"
description = "A Windows-native Task Manager for remote Linux hosts"
license = "MIT"
repository = "https://github.com/UZ1sFED3yS/tuxtop"
# Not a crates.io crate: this is an application, and it depends on
# tuxtop-core by path. cargo-deny also needs this to tell an internal
# path dependency from a `foo = "*"` pulled off a registry.
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tuxtop-core = { path = "../crates/tuxtop-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# SSH is handled by tuxtop-core, which shells out to the system ssh (ADR-007).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
