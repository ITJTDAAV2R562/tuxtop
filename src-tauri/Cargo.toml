# SCAFFOLD — never compiled here; the GUI cannot be built from WSL (ADR-006).
# Phase 2 of docs/ROADMAP.md builds this on Windows and pins real versions.

[package]
name = "tuxtop"
version = "0.1.0"
edition = "2021"
description = "A Windows-native Task Manager for remote Linux hosts"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tuxtop-core = { path = "../crates/tuxtop-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SSH is handled by tuxtop-core, which shells out to the system ssh (ADR-007).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.5"
