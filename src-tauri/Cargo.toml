# Its own workspace root. Cargo refuses to build a package that sits inside a
# workspace directory without being a member, and ADR-006 keeps this out of the
# root workspace so `cargo test` there never tries to build the GUI.
[workspace]

[package]
name = "tuxtop"
version = "0.1.0"
edition = "2021"
description = "A Windows-native Task Manager for remote Linux hosts"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tuxtop-core = { path = "../crates/tuxtop-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# SSH is handled by tuxtop-core, which shells out to the system ssh (ADR-007).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
