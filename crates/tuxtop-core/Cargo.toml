[package]
name = "tuxtop-core"
version = "0.6.3"
edition = "2021"
description = "Sampling, parsing and rate maths for Tuxtop. No GUI dependency."
license = "MIT"
repository = "https://github.com/ITJTDAAV2R562/tuxtop"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }

# Already in the tree on Windows via tokio, so this costs no new crates. It is
# here for one thing: the job object in `transport::win_job` that kills the ssh
# children when this process dies hard, which no destructor can do.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects"] }

[dev-dependencies]
serde_json = "1"
toml = "0.8"
